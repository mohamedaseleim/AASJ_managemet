<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="azharGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background with Safe Padding for Maskable Icons -->
  <rect width="512" height="512" rx="112" fill="url(#azharGrad)" />

  <!-- Outer Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-dasharray="8 6" opacity="0.8" />
  <circle cx="256" cy="256" r="195" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3" />

  <!-- Shield Base -->
  <g filter="url(#shadow)">
    <path d="M 256 95 L 365 140 C 365 260 256 345 256 345 C 256 345 147 260 147 140 Z" fill="#ffffff" fill-opacity="0.12" stroke="url(#goldGrad)" stroke-width="6"/>
  </g>

  <!-- Open Book Symbol (Academic Knowledge) -->
  <path d="M 256 265 Q 220 250 170 255 L 170 310 Q 220 305 256 320 Q 292 305 342 310 L 342 255 Q 292 250 256 265 Z" fill="#ffffff" opacity="0.95" />
  <path d="M 256 265 L 256 320" stroke="#047857" stroke-width="3" />

  <!-- Wheat Spikes (Agriculture) -->
  <g stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" fill="none">
    <!-- Left Wheat -->
    <path d="M 200 240 Q 185 200 195 165" />
    <ellipse cx="185" cy="185" rx="8" ry="14" transform="rotate(-35 185 185)" fill="#fbbf24" />
    <ellipse cx="198" cy="160" rx="8" ry="14" transform="rotate(-15 198 160)" fill="#fbbf24" />
    <!-- Right Wheat -->
    <path d="M 312 240 Q 327 200 317 165" />
    <ellipse cx="327" cy="185" rx="8" ry="14" transform="rotate(35 327 185)" fill="#fbbf24" />
    <ellipse cx="314" cy="160" rx="8" ry="14" transform="rotate(15 314 160)" fill="#fbbf24" />
  </g>

  <!-- Typography AASJ -->
  <text x="256" y="395" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#fbbf24" letter-spacing="4">AASJ</text>
  <text x="256" y="430" text-anchor="middle" font-family="'Cairo', system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff" opacity="0.9">أرشيف العلوم الزراعية</text>
  <text x="256" y="455" text-anchor="middle" font-family="'Cairo', system-ui, sans-serif" font-size="16" font-weight="600" fill="#a7f3d0">جامعة الأزهر - EKB</text>
</svg>
