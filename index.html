        const origError = console.error;
        console.error = function(...args) {
          if (args.length > 0 && typeof args[0] === 'string' && (args[0] === '[vite]' || args[0].includes('[vite]') || args[0].includes('websocket') || args[0].includes('WebSocket'))) {
            return;
          }
          origError.apply(console, args);
        };
      })();
